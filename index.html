<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오목 게임</title><style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#eaf0ff;background:#0c1426}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:min(100%,850px);background:#17233b;border:1px solid #334563;border-radius:22px;padding:24px;box-shadow:0 20px 65px #0005}h1{margin:0 0 6px;font-size:29px}.sub{color:#aebcd5;margin:0 0 20px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}button,select{border:1px solid #50617b;border-radius:10px;background:#273a58;color:white;padding:10px 14px;font-size:15px;cursor:pointer}button:hover{background:#365477}button:focus-visible,select:focus-visible{outline:3px solid #75baff}.status{background:#253957;padding:13px 16px;border-radius:12px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}.stone{display:inline-block;width:19px;height:19px;border-radius:50%;border:1px solid #ffffff55}.black{background:#111}.white{background:#fff}.boardwrap{display:flex;justify-content:center;overflow:auto}.board{position:relative;width:min(100%,660px);aspect-ratio:1;background:#d8a968;border:8px solid #a66e35;border-radius:7px;box-shadow:inset 0 0 15px #6e401e55;touch-action:manipulation;user-select:none}.board svg{display:block;width:100%;height:100%}.board button{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;border-radius:50%;background:transparent;width:6.3%;height:6.3%;min-width:0;min-height:0}.board button:hover:not(:disabled){background:#fff5}.board button:focus-visible{outline:2px solid #1671ee}.board button:disabled{cursor:default}.help{color:#aebcd5;font-size:13px;line-height:1.6;margin-top:15px}#message{color:#aebcd5;margin-left:auto;font-size:13px}@media(max-width:520px){.app{padding:13px}h1{font-size:24px}.toolbar{gap:7px}button,select{font-size:13px;padding:9px}.board{border-width:5px}}
</style></head><body><main class="app"><h1>⚫ 오목 게임 ⚪</h1><p class="sub">친구와 대결하거나 컴퓨터와 한 판!</p><div class="toolbar"><label for="mode">게임 모드</label><select id="mode"><option value="ai">컴퓨터 대전</option><option value="pvp">2인 대전</option></select><button id="reset">새 게임</button><button id="undo">한 수 무르기</button><span id="message"></span></div><div class="status" id="status" aria-live="polite"></div><div class="boardwrap"><div class="board" id="board" aria-label="15줄 오목판"></div></div><div class="help">흑이 먼저 시작합니다. 가로·세로·대각선으로 연속 5개 이상 놓으면 승리합니다. (자유룰, 금수 없음) 컴퓨터 대전에서는 플레이어가 흑입니다.</div></main><script>
const N=15, boardEl=document.getElementById('board'),statusEl=document.getElementById('status'),modeEl=document.getElementById('mode'),messageEl=document.getElementById('message');let cells,turn,over,history,busy=false,version=0;const dirs=[[1,0],[0,1],[1,1],[1,-1]];const inside=(x,y)=>x>=0&&x<N&&y>=0&&y<N;
function reset(){version++;cells=Array.from({length:N},()=>Array(N).fill(0));turn=1;over=false;busy=false;history=[];messageEl.textContent='';render();}
function count(x,y,dx,dy,p){let n=0;for(let i=1;inside(x+dx*i,y+dy*i)&&cells[y+dy*i][x+dx*i]===p;i++)n++;return n}
function win(x,y,p){return dirs.some(([dx,dy])=>1+count(x,y,dx,dy,p)+count(x,y,-dx,-dy,p)>=5)}
function place(x,y){if(over||busy||cells[y][x])return;cells[y][x]=turn;history.push({x,y,p:turn});if(win(x,y,turn)){over=true;messageEl.textContent='승리!'}else if(history.length===N*N){over=true;messageEl.textContent='무승부'}else turn=3-turn;render();if(!over&&modeEl.value==='ai'&&turn===2){busy=true;statusEl.textContent='⚪ 컴퓨터가 생각 중입니다…';const v=version;setTimeout(()=>{if(v!==version)return;busy=false;let [ax,ay]=aiMove();place(ax,ay)},260)}}
function score(x,y,p){let total=0;for(const [dx,dy] of dirs){let a=count(x,y,dx,dy,p),b=count(x,y,-dx,-dy,p),len=a+b+1;let open=(inside(x+(a+1)*dx,y+(a+1)*dy)&&cells[y+(a+1)*dy][x+(a+1)*dx]===0?1:0)+(inside(x-(b+1)*dx,y-(b+1)*dy)&&cells[y-(b+1)*dy][x-(b+1)*dx]===0?1:0);if(len>=5)return 1000000;total+=len===4?(open===2?120000:open===1?16000:0):len===3?(open===2?9000:open===1?800:0):len===2?(open===2?350:open===1?45:0):open===2?8:1}return total}
function aiMove(){let candidates=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!cells[y][x]){let near=history.length===0||history.some(m=>Math.abs(m.x-x)<=2&&Math.abs(m.y-y)<=2);if(!near)continue;let atk=score(x,y,2),def=score(x,y,1);candidates.push({x,y,atk,def,value:atk*1.12+def+Math.random()*5})}if(!candidates.length)return[7,7];let winning=candidates.find(c=>c.atk>=1000000);if(winning)return[winning.x,winning.y];let block=candidates.find(c=>c.def>=1000000);if(block)return[block.x,block.y];candidates.sort((a,b)=>b.value-a.value);return[candidates[0].x,candidates[0].y]}
function render(){let svg='<svg viewBox="0 0 600 600" aria-hidden="true">';for(let i=0;i<N;i++){let q=20+i*40;svg+=`<line x1="20" y1="${q}" x2="580" y2="${q}" stroke="#624421" stroke-width="1.3"/><line x1="${q}" y1="20" x2="${q}" y2="580" stroke="#624421" stroke-width="1.3"/>`}for(let y of [3,7,11])for(let x of [3,7,11])svg+=`<circle cx="${20+x*40}" cy="${20+y*40}" r="4" fill="#624421"/>`;for(let m of history){let cx=20+m.x*40,cy=20+m.y*40;svg+=`<circle cx="${cx}" cy="${cy}" r="17.5" fill="${m.p===1?'#141820':'#f9f9f9'}" stroke="${m.p===1?'#444':'#a3a3a3'}" stroke-width="1.2"/>`}if(history.length){let m=history.at(-1);svg+=`<circle cx="${20+m.x*40}" cy="${20+m.y*40}" r="4" fill="${m.p===1?'#f5f5f5':'#202020'}"/>`}svg+='</svg>';boardEl.innerHTML=svg;for(let y=0;y<N;y++)for(let x=0;x<N;x++){let b=document.createElement('button');b.style.left=`${(20+x*40)/600*100}%`;b.style.top=`${(20+y*40)/600*100}%`;b.setAttribute('aria-label',`${x+1}열 ${y+1}행 ${cells[y][x]===1?'흑돌':cells[y][x]===2?'백돌':'빈자리'}`);b.disabled=!!cells[y][x]||over;b.addEventListener('click',()=>place(x,y));boardEl.appendChild(b)}if(over){let m=history.at(-1);statusEl.innerHTML=m&&win(m.x,m.y,m.p)?`<span class="stone ${m.p===1?'black':'white'}"></span>${m.p===1?'흑':'백'} 승리! 🎉`:'무승부!'}else statusEl.innerHTML=`<span class="stone ${turn===1?'black':'white'}"></span>${turn===1?'흑':'백'} 차례 ${modeEl.value==='ai'?(turn===1?'· 플레이어':'· 컴퓨터'):''}`;}
document.getElementById('reset').onclick=reset;modeEl.onchange=reset;document.getElementById('undo').onclick=()=>{if(!history.length)return;version++;busy=false;let n=modeEl.value==='ai'&&history.length>=2&&history.at(-1).p===2?2:1;while(n--&&history.length){let m=history.pop();cells[m.y][m.x]=0}turn=history.length?3-history.at(-1).p:1;over=false;messageEl.textContent='';render()};reset();
</script></body></html>
